<div class="relative">
  <!-- Trigger button -->
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    class="inline-flex items-center gap-2 h-10 px-4 rounded-full
           bg-[var(--bg-elevated)] border border-[var(--border)]
           text-sm font-medium text-[var(--text-primary)]
           hover:border-[var(--accent)] transition-colors
           focus-ring min-w-[180px] justify-between"
  >
    <span class="flex items-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="text-[var(--text-muted)]"
      >
        <path d="m3 16 4 4 4-4" />
        <path d="M7 20V4" />
        <path d="M11 4h10" />
        <path d="M11 8h7" />
        <path d="M11 12h4" />
      </svg>
      {{ getCurrentLabel() }}
    </span>

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="text-[var(--text-muted)] transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  <!-- Dropdown -->
  @if (isOpen()) {
    <div
      role="listbox"
      class="absolute top-full mt-2 end-0 z-30 min-w-[220px] py-1.5 rounded-xl
             bg-[var(--bg-elevated)] border border-[var(--border)]
             shadow-xl animate-fade-in-down"
    >
      @for (option of options; track option.value) {
        <button
          type="button"
          role="option"
          [attr.aria-selected]="option.value === value()"
          (click)="select(option)"
          class="w-full flex items-center justify-between gap-3 px-4 py-2.5 text-sm text-start transition-colors"
          [class.text-[var(--accent)]]="option.value === value()"
          [class.font-medium]="option.value === value()"
          [class.text-[var(--text-primary)]]="option.value !== value()"
          [class.hover:bg-[var(--surface)]]="true"
        >
          <span>{{ language.t(option.labelKey) }}</span>
          @if (option.value === value()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>
