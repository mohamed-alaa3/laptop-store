<section class="mt-16 md:mt-20">
  <!-- Heading -->
  <div class="flex items-end justify-between mb-8">
    <h2 class="text-2xl md:text-3xl font-bold text-[var(--text-primary)]">
      {{ language.t('productDetails.relatedProducts') }}
    </h2>
  </div>

  <!-- Grid -->
  @if (loading()) {
    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"
    >
      @for (item of [1, 2, 3, 4]; track item) {
        <div
          class="rounded-2xl border border-[var(--border)] bg-[var(--bg-elevated)] overflow-hidden"
        >
          <app-skeleton shape="rect" width="100%" height="200px" />
          <div class="p-4 space-y-3">
            <app-skeleton width="40%" height="0.75rem" />
            <app-skeleton width="90%" height="1rem" />
            <app-skeleton width="60%" height="0.75rem" />
          </div>
        </div>
      }
    </div>
  } @else if (products().length > 0) {
    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"
    >
      @for (product of products(); track product._id) {
        <app-product-card [product]="product" />
      }
    </div>
  }
</section>
