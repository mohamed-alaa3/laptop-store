<div class="space-y-4">
  <!-- Main image -->
  <div
    class="relative aspect-square rounded-3xl overflow-hidden border border-[var(--border)] bg-[var(--surface)] group"
  >
    @if (hasImages() && activeImage(); as img) {
      <img
        [src]="img.url"
        [alt]="productName()"
        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
      />

      <!-- Navigation arrows (only if more than 1) -->
      @if (images().length > 1) {
        <button
          type="button"
          (click)="prev()"
          class="absolute top-1/2 start-4 -translate-y-1/2 w-10 h-10 rounded-full bg-[var(--bg-elevated)]/90 backdrop-blur-sm border border-[var(--border)] flex items-center justify-center text-[var(--text-primary)] hover:scale-110 transition-all opacity-0 group-hover:opacity-100 focus-ring"
          aria-label="Previous image"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="rtl:rotate-180"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>

        <button
          type="button"
          (click)="next()"
          class="absolute top-1/2 end-4 -translate-y-1/2 w-10 h-10 rounded-full bg-[var(--bg-elevated)]/90 backdrop-blur-sm border border-[var(--border)] flex items-center justify-center text-[var(--text-primary)] hover:scale-110 transition-all opacity-0 group-hover:opacity-100 focus-ring"
          aria-label="Next image"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="rtl:rotate-180"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>

        <!-- Image counter -->
        <div
          class="absolute bottom-4 end-4 px-3 py-1 rounded-full bg-[var(--bg-elevated)]/90 backdrop-blur-sm border border-[var(--border)] text-xs font-medium text-[var(--text-secondary)]"
        >
          {{ activeIndex() + 1 }} / {{ images().length }}
        </div>
      }
    } @else {
      <!-- Placeholder -->
      <div
        class="w-full h-full flex items-center justify-center"
        style="background: linear-gradient(135deg, var(--accent-soft) 0%, var(--surface) 100%)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="96"
          height="96"
          viewBox="0 0 24 24"
          fill="none"
          stroke="var(--accent)"
          stroke-width="1"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="opacity-50"
        >
          <path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z" />
          <path d="M20.054 15.987H3.946" />
        </svg>
      </div>
    }
  </div>

  <!-- Thumbnails -->
  @if (images().length > 1) {
    <div class="grid grid-cols-4 gap-3">
      @for (img of images(); track img.publicId; let i = $index) {
        <button
          type="button"
          (click)="select(i)"
          class="relative aspect-square rounded-xl overflow-hidden border-2 transition-all focus-ring"
          [class.border-[var(--accent)]]="activeIndex() === i"
          [class.border-transparent]="activeIndex() !== i"
          [class.opacity-100]="activeIndex() === i"
          [class.opacity-60]="activeIndex() !== i"
          [class.hover:opacity-100]="activeIndex() !== i"
        >
          <img
            [src]="img.url"
            [alt]="productName() + ' ' + (i + 1)"
            class="w-full h-full object-cover"
            loading="lazy"
          />
        </button>
      }
    </div>
  }
</div>
