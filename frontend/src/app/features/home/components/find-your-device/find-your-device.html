<section class="container-app py-16 md:py-20">
  <div
    class="relative rounded-3xl border border-[var(--border)] overflow-hidden"
    style="background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--surface) 100%)"
  >
     <div class="p-8 md:p-12">
      <!-- Header -->
      <div appScrollReveal class="text-center max-w-2xl mx-auto mb-10">
<h2 class="section-title text-[var(--text-primary)]">
  {{ language.t('home.findYourDevice.title') }}
</h2>
<p class="text-sm text-[var(--text-secondary)] mt-2">
  {{ language.t('home.findYourDevice.subtitle') }}
</p>
      </div>

      <!-- Options grid -->
      <div appStagger [appStaggerDelay]="100" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        @for (option of options; track option.id) {
          <button
            type="button"
            (click)="select(option)"
            class="card-premium group relative p-6 rounded-2xl border border-[var(--border)] bg-[var(--bg-elevated)] text-start focus-ring"
          >
            <!-- Icon -->
            <div
              class="icon-tile-colored relative w-12 h-12 rounded-xl flex items-center justify-center mb-4"
              [style.background]="option.accent + '20'"
              [style.color]="option.accent"
            >
              @switch (option.icon) {
                @case ('gaming') {
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="6" x2="10" y1="12" y2="12" />
                    <line x1="8" x2="8" y1="10" y2="14" />
                    <line x1="15" x2="15.01" y1="13" y2="13" />
                    <line x1="18" x2="18.01" y1="11" y2="11" />
                    <rect width="20" height="12" x="2" y="6" rx="6" />
                  </svg>
                }
                @case ('work') {
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect width="20" height="14" x="2" y="7" rx="2" ry="2" />
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                  </svg>
                }
                @case ('design') {
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                    <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                    <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                    <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                    <path
                      d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"
                    />
                  </svg>
                }
                @case ('student') {
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                    <path d="M6 12v5c3 3 9 3 12 0v-5" />
                  </svg>
                }
              }
            </div>

            <!-- Text -->
 <h3 class="relative text-base font-semibold text-[var(--text-primary)] mb-1">
  {{ getTitle(option.id) }}
</h3>
<p class="relative text-xs text-[var(--text-muted)]">{{ getDesc(option.id) }}</p>
            <!-- Arrow -->
            <div
              class="absolute top-6 end-6 text-[var(--text-muted)] group-hover:text-[var(--accent)] group-hover:translate-x-1 rtl:group-hover:-translate-x-1 transition-all duration-300"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="rtl:rotate-180"
              >
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
              </svg>
            </div>
          </button>
        }
      </div>
    </div>
  </div>
</section>
